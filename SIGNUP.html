<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Task Master - Sign Up</title>
    <link rel="icon" type="image/png" href="taskmaster_logo.png">
    <link rel="stylesheet" href="Task.css">
</head>
<body>
    <div class="outer-container">
        <div class="outer-card">
            <h1>Task Master</h1>
            <p>Join us and master your tasks.</p>
            <form id="signupForm" action="Home.html" method="GET">
                <div class="input-group">
                    <label for="fullname">Full Name</label>
                    <input type="text" name="UserName" id="fullname" placeholder="Your Name" required>
                </div>
                <input type="hidden" name="status" value="signup">
                <div class="input-group">
                    <label for="email">Email</label>
                    <input type="email" id="email" placeholder="Email Address" required>
                </div>
                <!-- <div class="input-group">
                    <label for="dob">DOB</label>
                    <input type="date" id="dob" required>
                </div> -->
                <div class="input-group">
                    <label for="mobile">Mobile No.</label>
                    <input type="tel" id="mobile" placeholder="Enter Number" required>
                </div>
                <div class="input-group">
                    <label for="password">Password</label>
                    <input type="password" id="password" placeholder="Create Password" required>
                </div>
                <button type="submit" class="btn-primary">Create Account</button>
                <div style="text-align: center; margin: 15px 0; color: #888; font-size: 14px;">or</div>
                <a href="http://localhost:5005/api/auth/google?userId=signup" style="display: flex; align-items: center; justify-content: center; gap: 8px; background-color: white; color: #757575; border: 1px solid #ddd; padding: 10px; border-radius: 4px; text-decoration: none; font-weight: bold; width: 100%; box-sizing: border-box; transition: background-color 0.3s;" onmouseover="this.style.backgroundColor='#f1f1f1'" onmouseout="this.style.backgroundColor='white'">
                    <img src="https://developers.google.com/identity/images/g-logo.png" alt="Google" width="20" height="20">
                    Sign up with Google
                </a>
            </form>
            <p class="outer-footer">
                Already have an account? <a href="Login.html">Login here</a>
            </p>
        </div>
    </div>
   <script src="Task.js"></script>
</body>
</html>
